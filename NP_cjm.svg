<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="monospace, sans-serif">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', monospace, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#0e0e0a"/>

  <!-- Title -->
  <text x="40" y="44" font-size="13" fill="#a8a89a" letter-spacing="2" text-anchor="start">NOTIFICATION PLATFORM — CJM</text>
  <text x="40" y="70" font-size="22" font-weight="bold" fill="#f0ece0">Путь пользователя: от получения до управления уведомлениями</text>

  <!-- Stage columns: x positions -->
  <!-- Col 0 label: 0-180, Col 1-5 stages: 180+200*n -->

  <!-- Header row background -->
  <rect x="0" y="88" width="1200" height="44" fill="#1a1a16"/>
  <rect x="180" y="88" width="200" height="44" fill="#c9f135" rx="0"/>
  <rect x="380" y="88" width="200" height="44" fill="#1e2a1a" rx="0"/>
  <rect x="580" y="88" width="200" height="44" fill="#1e2a1a" rx="0"/>
  <rect x="780" y="88" width="200" height="44" fill="#1e2a1a" rx="0"/>
  <rect x="980" y="88" width="220" height="44" fill="#1e2a1a" rx="0"/>

  <!-- Stage labels -->
  <text x="90" y="116" font-size="11" fill="#6b6860" font-weight="bold" letter-spacing="1" text-anchor="middle">ЭТАП</text>
  <text x="280" y="112" font-size="12" font-weight="bold" fill="#0e0e0a" text-anchor="middle">01</text>
  <text x="280" y="126" font-size="11" font-weight="bold" fill="#0e0e0a" text-anchor="middle">ПОЛУЧЕНИЕ</text>
  <text x="480" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">02</text>
  <text x="480" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">ПРОСМОТР</text>
  <text x="680" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">03</text>
  <text x="680" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">НАСТРОЙКА</text>
  <text x="880" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">04</text>
  <text x="880" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">УПРАВЛЕНИЕ</text>
  <text x="1090" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">05</text>
  <text x="1090" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">МОНИТОРИНГ</text>

  <!-- Dividers vertical -->
  <line x1="180" y1="88" x2="180" y2="560" stroke="#2a2a24" stroke-width="1"/>
  <line x1="380" y1="88" x2="380" y2="560" stroke="#2a2a24" stroke-width="1"/>
  <line x1="580" y1="88" x2="580" y2="560" stroke="#2a2a24" stroke-width="1"/>
  <line x1="780" y1="88" x2="780" y2="560" stroke="#2a2a24" stroke-width="1"/>
  <line x1="980" y1="88" x2="980" y2="560" stroke="#2a2a24" stroke-width="1"/>

  <!-- ── ROW 1: ДЕЙСТВИЯ ── -->
  <rect x="0" y="132" width="1200" height="80" fill="#141410"/>
  <line x1="0" y1="132" x2="1200" y2="132" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="156" font-size="9" fill="#6b6860" letter-spacing="1">ДЕЙСТВИЯ</text>
  <text x="16" y="170" font-size="10" fill="#a8a89a">пользователя</text>

  <text x="196" y="155" font-size="11" fill="#f0ece0">Получает уведомление</text>
  <text x="196" y="171" font-size="11" fill="#f0ece0">в email / push / SMS</text>
  <text x="196" y="187" font-size="10" fill="#6b6860">или в интерфейсе</text>
  <text x="396" y="155" font-size="11" fill="#f0ece0">Открывает список,</text>
  <text x="396" y="171" font-size="11" fill="#f0ece0">читает уведомление</text>
  <text x="396" y="187" font-size="10" fill="#6b6860">оценивает важность</text>
  <text x="596" y="155" font-size="11" fill="#f0ece0">Заходит в настройки,</text>
  <text x="596" y="171" font-size="11" fill="#f0ece0">выбирает каналы</text>
  <text x="596" y="187" font-size="10" fill="#6b6860">и фильтры</text>
  <text x="796" y="155" font-size="11" fill="#f0ece0">Создаёт группы,</text>
  <text x="796" y="171" font-size="11" fill="#f0ece0">управляет подписками</text>
  <text x="796" y="187" font-size="10" fill="#6b6860">и согласованиями</text>
  <text x="996" y="155" font-size="11" fill="#f0ece0">Смотрит статистику,</text>
  <text x="996" y="171" font-size="11" fill="#f0ece0">проверяет доставку</text>
  <text x="996" y="187" font-size="10" fill="#6b6860">и сценарии</text>

  <!-- ── ROW 2: ТОЧКИ КАСАНИЯ ── -->
  <rect x="0" y="212" width="1200" height="76" fill="#0e0e0a"/>
  <line x1="0" y1="212" x2="1200" y2="212" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="236" font-size="9" fill="#6b6860" letter-spacing="1">ТОЧКИ</text>
  <text x="16" y="250" font-size="9" fill="#6b6860" letter-spacing="1">КАСАНИЯ</text>

  <rect x="196" y="222" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="238" y="236" font-size="10" fill="#c9f135" text-anchor="middle">Email / Push</text>
  <rect x="286" y="222" width="60" height="20" rx="3" fill="#1e2a1a"/>
  <text x="316" y="236" font-size="10" fill="#c9f135" text-anchor="middle">SMS</text>
  <rect x="196" y="248" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="238" y="262" font-size="10" fill="#c9f135" text-anchor="middle">Интерфейс</text>

  <rect x="396" y="222" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="448" y="236" font-size="10" fill="#c9f135" text-anchor="middle">Лента событий</text>
  <rect x="396" y="248" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="438" y="262" font-size="10" fill="#c9f135" text-anchor="middle">Карточка NF</text>

  <rect x="596" y="222" width="114" height="20" rx="3" fill="#1e2a1a"/>
  <text x="653" y="236" font-size="10" fill="#c9f135" text-anchor="middle">Редактор фильтров</text>
  <rect x="596" y="248" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="648" y="262" font-size="10" fill="#c9f135" text-anchor="middle">Настройка каналов</text>

  <rect x="796" y="222" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="848" y="236" font-size="10" fill="#c9f135" text-anchor="middle">Группы подписок</text>
  <rect x="796" y="248" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="838" y="262" font-size="10" fill="#c9f135" text-anchor="middle">Согласования</text>

  <rect x="996" y="222" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="1038" y="236" font-size="10" fill="#c9f135" text-anchor="middle">Дашборд</text>
  <rect x="996" y="248" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="1048" y="262" font-size="10" fill="#c9f135" text-anchor="middle">Статистика NF</text>

  <!-- ── ROW 3: БОЛИ ── -->
  <rect x="0" y="288" width="1200" height="76" fill="#141410"/>
  <line x1="0" y1="288" x2="1200" y2="288" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="312" font-size="9" fill="#6b6860" letter-spacing="1">БОЛИ</text>

  <text x="196" y="312" font-size="11" fill="#e05050">Много лишнего шума,</text>
  <text x="196" y="327" font-size="11" fill="#e05050">нет приоритизации</text>
  <text x="196" y="342" font-size="10" fill="#6b6860">63% → поддержка</text>

  <text x="396" y="312" font-size="11" fill="#e05050">Нет фильтрации</text>
  <text x="396" y="327" font-size="11" fill="#e05050">по типу и важности</text>
  <text x="396" y="342" font-size="10" fill="#6b6860">всё смешано</text>

  <text x="596" y="312" font-size="11" fill="#e08830">Настройки сложные,</text>
  <text x="596" y="327" font-size="11" fill="#e08830">разные для каждой</text>
  <text x="596" y="342" font-size="10" fill="#6b6860">системы отдельно</text>

  <text x="796" y="312" font-size="11" fill="#e08830">Нет единой точки</text>
  <text x="796" y="327" font-size="11" fill="#e08830">управления группами</text>
  <text x="796" y="342" font-size="10" fill="#6b6860">подписок</text>

  <text x="996" y="312" font-size="11" fill="#c9f135">Нет данных о</text>
  <text x="996" y="327" font-size="11" fill="#c9f135">доставке и охвате</text>
  <text x="996" y="342" font-size="10" fill="#6b6860">нотификаций</text>

  <!-- ── ROW 4: ВОЗМОЖНОСТИ ── -->
  <rect x="0" y="364" width="1200" height="76" fill="#0e0e0a"/>
  <line x1="0" y1="364" x2="1200" y2="364" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="388" font-size="9" fill="#6b6860" letter-spacing="1">ВОЗМОЖНОСТИ</text>

  <text x="196" y="388" font-size="11" fill="#50c878">Пресеты профилей</text>
  <text x="196" y="403" font-size="11" fill="#50c878">по сегментам</text>
  <text x="196" y="418" font-size="10" fill="#6b6860">онколл / CTO / минималист</text>

  <text x="396" y="388" font-size="11" fill="#50c878">Умная лента</text>
  <text x="396" y="403" font-size="11" fill="#50c878">с приоритетами</text>
  <text x="396" y="418" font-size="10" fill="#6b6860">критичное выше</text>

  <text x="596" y="388" font-size="11" fill="#50c878">Единый редактор</text>
  <text x="596" y="403" font-size="11" fill="#50c878">всех каналов</text>
  <text x="596" y="418" font-size="10" fill="#6b6860">email + push + SMS</text>

  <text x="796" y="388" font-size="11" fill="#50c878">Согласование</text>
  <text x="796" y="403" font-size="11" fill="#50c878">подписок в 1 клик</text>
  <text x="796" y="418" font-size="10" fill="#6b6860">workflow апрувов</text>

  <text x="996" y="388" font-size="11" fill="#50c878">Дашборд с метриками</text>
  <text x="996" y="403" font-size="11" fill="#50c878">охвата и доставки</text>
  <text x="996" y="418" font-size="10" fill="#6b6860">для PM и СТО</text>

  <!-- Bottom border -->
  <line x1="0" y1="440" x2="1200" y2="440" stroke="#2a2a24" stroke-width="1"/>

  <!-- Footer metrics -->
  <rect x="0" y="440" width="1200" height="120" fill="#0e0e0a"/>
  <text x="40" y="470" font-size="9" fill="#6b6860" letter-spacing="2">РЕЗУЛЬТАТ</text>

  <text x="40" y="505" font-size="28" font-weight="bold" fill="#c9f135">584→2040</text>
  <text x="40" y="523" font-size="10" fill="#6b6860" letter-spacing="1">ПОЛУЧАТЕЛЕЙ</text>

  <text x="280" y="505" font-size="28" font-weight="bold" fill="#c9f135">×2.8</text>
  <text x="280" y="523" font-size="10" fill="#6b6860" letter-spacing="1">УВЕДОМЛЕНИЙ ОТПРАВЛЕНО</text>

  <text x="520" y="505" font-size="28" font-weight="bold" fill="#c9f135">63%→34%</text>
  <text x="520" y="523" font-size="10" fill="#6b6860" letter-spacing="1">ОБРАЩЕНИЙ В ПОДДЕРЖКУ</text>

  <text x="820" y="505" font-size="28" font-weight="bold" fill="#c9f135">281→373</text>
  <text x="820" y="523" font-size="10" fill="#6b6860" letter-spacing="1">УНИКАЛЬНЫХ СЦЕНАРИЕВ</text>

  <!-- Segment badges -->
  <text x="40" y="550" font-size="9" fill="#3a3a30">Сегменты: </text>
  <rect x="110" y="538" width="70" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="145" y="550" font-size="9" fill="#a8a89a" text-anchor="middle">Дежурные</text>
  <rect x="188" y="538" width="70" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="223" y="550" font-size="9" fill="#a8a89a" text-anchor="middle">CTO / Архит.</text>
  <rect x="266" y="538" width="74" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="303" y="550" font-size="9" fill="#a8a89a" text-anchor="middle">Сотрудники</text>
  <rect x="348" y="538" width="80" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="388" y="550" font-size="9" fill="#a8a89a" text-anchor="middle">Минималисты</text>
</svg>
