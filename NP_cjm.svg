<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="monospace, sans-serif">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', monospace, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="620" fill="#0e0e0a"/>

  <!-- Title -->
  <text x="40" y="44" font-size="13" fill="#a8a89a" letter-spacing="2" text-anchor="start">NOTIFICATION PLATFORM — CJM</text>
  <text x="40" y="70" font-size="22" font-weight="bold" fill="#f0ece0">Путь пользователя: от получения до управления уведомлениями</text>

  <!-- Stage columns: x positions -->
  <!-- Col 0 label: 0-180, Col 1-5 stages: 180+200*n -->

  <!-- Header row background -->
  <rect x="0" y="88" width="1200" height="44" fill="#1a1a16"/>
  <rect x="180" y="88" width="200" height="44" fill="#c9f135" rx="0"/>
  <rect x="380" y="88" width="200" height="44" fill="#1e2a1a" rx="0"/>
  <rect x="580" y="88" width="200" height="44" fill="#1e2a1a" rx="0"/>
  <rect x="780" y="88" width="200" height="44" fill="#1e2a1a" rx="0"/>
  <rect x="980" y="88" width="220" height="44" fill="#1e2a1a" rx="0"/>

  <!-- Stage labels -->
  <text x="90" y="116" font-size="11" fill="#6b6860" font-weight="bold" letter-spacing="1" text-anchor="middle">ЭТАП</text>
  <text x="280" y="112" font-size="12" font-weight="bold" fill="#0e0e0a" text-anchor="middle">01</text>
  <text x="280" y="126" font-size="11" font-weight="bold" fill="#0e0e0a" text-anchor="middle">ПОЛУЧЕНИЕ</text>
  <text x="480" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">02</text>
  <text x="480" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">ПРОСМОТР</text>
  <text x="680" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">03</text>
  <text x="680" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">НАСТРОЙКА</text>
  <text x="880" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">04</text>
  <text x="880" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">УПРАВЛЕНИЕ</text>
  <text x="1090" y="112" font-size="12" font-weight="bold" fill="#c9f135" text-anchor="middle">05</text>
  <text x="1090" y="126" font-size="11" font-weight="bold" fill="#f0ece0" text-anchor="middle">МОНИТОРИНГ</text>

  <!-- Dividers vertical -->
  <line x1="180" y1="88" x2="180" y2="620" stroke="#2a2a24" stroke-width="1"/>
  <line x1="380" y1="88" x2="380" y2="620" stroke="#2a2a24" stroke-width="1"/>
  <line x1="580" y1="88" x2="580" y2="620" stroke="#2a2a24" stroke-width="1"/>
  <line x1="780" y1="88" x2="780" y2="620" stroke="#2a2a24" stroke-width="1"/>
  <line x1="980" y1="88" x2="980" y2="620" stroke="#2a2a24" stroke-width="1"/>

  <!-- ── ROW 1: ДЕЙСТВИЯ ── -->
  <rect x="0" y="132" width="1200" height="80" fill="#141410"/>
  <line x1="0" y1="132" x2="1200" y2="132" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="156" font-size="9" fill="#6b6860" letter-spacing="1">ДЕЙСТВИЯ</text>
  <text x="16" y="170" font-size="10" fill="#a8a89a">пользователя</text>

  <!-- Stage 1 actions -->
  <text x="196" y="155" font-size="11" fill="#f0ece0">Получает уведомление</text>
  <text x="196" y="171" font-size="11" fill="#f0ece0">в email / push / SMS</text>
  <text x="196" y="187" font-size="10" fill="#6b6860">или в интерфейсе</text>
  <!-- Stage 2 -->
  <text x="396" y="155" font-size="11" fill="#f0ece0">Открывает список,</text>
  <text x="396" y="171" font-size="11" fill="#f0ece0">читает уведомление</text>
  <text x="396" y="187" font-size="10" fill="#6b6860">оценивает важность</text>
  <!-- Stage 3 -->
  <text x="596" y="155" font-size="11" fill="#f0ece0">Заходит в настройки,</text>
  <text x="596" y="171" font-size="11" fill="#f0ece0">выбирает каналы</text>
  <text x="596" y="187" font-size="10" fill="#6b6860">и фильтры</text>
  <!-- Stage 4 -->
  <text x="796" y="155" font-size="11" fill="#f0ece0">Создаёт группы,</text>
  <text x="796" y="171" font-size="11" fill="#f0ece0">управляет подписками</text>
  <text x="796" y="187" font-size="10" fill="#6b6860">и согласованиями</text>
  <!-- Stage 5 -->
  <text x="996" y="155" font-size="11" fill="#f0ece0">Смотрит статистику,</text>
  <text x="996" y="171" font-size="11" fill="#f0ece0">проверяет доставку</text>
  <text x="996" y="187" font-size="10" fill="#6b6860">и сценарии</text>

  <!-- ── ROW 2: ЭМОЦИИ ── -->
  <rect x="0" y="212" width="1200" height="60" fill="#0e0e0a"/>
  <line x1="0" y1="212" x2="1200" y2="212" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="236" font-size="9" fill="#6b6860" letter-spacing="1">ЭМОЦИИ</text>
  <!-- Emotion curve -->
  <polyline points="280,255 480,240 680,230 880,235 1090,228" fill="none" stroke="#c9f135" stroke-width="2" stroke-linecap="round"/>
  <!-- Emotion dots -->
  <circle cx="280" cy="255" r="5" fill="#e05050"/>
  <circle cx="480" cy="240" r="5" fill="#e08830"/>
  <circle cx="680" cy="230" r="5" fill="#c9f135"/>
  <circle cx="880" cy="235" r="5" fill="#c9f135"/>
  <circle cx="1090" cy="228" r="5" fill="#50c878"/>
  <!-- Labels -->
  <text x="280" y="268" font-size="10" fill="#e05050" text-anchor="middle">😤 шум</text>
  <text x="480" y="268" font-size="10" fill="#e08830" text-anchor="middle">😐 скучно</text>
  <text x="680" y="268" font-size="10" fill="#c9f135" text-anchor="middle">🙂 удобно</text>
  <text x="880" y="268" font-size="10" fill="#c9f135" text-anchor="middle">😊 контроль</text>
  <text x="1090" y="268" font-size="10" fill="#50c878" text-anchor="middle">😌 спокойно</text>

  <!-- ── ROW 3: ТОЧКИ КАСАНИЯ ── -->
  <rect x="0" y="272" width="1200" height="76" fill="#141410"/>
  <line x1="0" y1="272" x2="1200" y2="272" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="296" font-size="9" fill="#6b6860" letter-spacing="1">ТОЧКИ</text>
  <text x="16" y="310" font-size="9" fill="#6b6860" letter-spacing="1">КАСАНИЯ</text>

  <!-- Tags -->
  <rect x="196" y="282" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="238" y="296" font-size="10" fill="#c9f135" text-anchor="middle">Email / Push</text>
  <rect x="286" y="282" width="60" height="20" rx="3" fill="#1e2a1a"/>
  <text x="316" y="296" font-size="10" fill="#c9f135" text-anchor="middle">SMS</text>
  <rect x="196" y="308" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="238" y="322" font-size="10" fill="#c9f135" text-anchor="middle">Интерфейс</text>

  <rect x="396" y="282" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="448" y="296" font-size="10" fill="#c9f135" text-anchor="middle">Лента событий</text>
  <rect x="396" y="308" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="438" y="322" font-size="10" fill="#c9f135" text-anchor="middle">Карточка NF</text>

  <rect x="596" y="282" width="114" height="20" rx="3" fill="#1e2a1a"/>
  <text x="653" y="296" font-size="10" fill="#c9f135" text-anchor="middle">Редактор фильтров</text>
  <rect x="596" y="308" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="648" y="322" font-size="10" fill="#c9f135" text-anchor="middle">Настройка каналов</text>

  <rect x="796" y="282" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="848" y="296" font-size="10" fill="#c9f135" text-anchor="middle">Группы подписок</text>
  <rect x="796" y="308" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="838" y="322" font-size="10" fill="#c9f135" text-anchor="middle">Согласования</text>

  <rect x="996" y="282" width="84" height="20" rx="3" fill="#1e2a1a"/>
  <text x="1038" y="296" font-size="10" fill="#c9f135" text-anchor="middle">Дашборд</text>
  <rect x="996" y="308" width="104" height="20" rx="3" fill="#1e2a1a"/>
  <text x="1048" y="322" font-size="10" fill="#c9f135" text-anchor="middle">Статистика NF</text>

  <!-- ── ROW 4: БОЛИ ── -->
  <rect x="0" y="348" width="1200" height="76" fill="#0e0e0a"/>
  <line x1="0" y1="348" x2="1200" y2="348" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="372" font-size="9" fill="#6b6860" letter-spacing="1">БОЛИ</text>

  <text x="196" y="372" font-size="11" fill="#e05050">Много лишнего шума,</text>
  <text x="196" y="387" font-size="11" fill="#e05050">нет приоритизации</text>
  <text x="196" y="402" font-size="10" fill="#6b6860">63% → поддержка</text>

  <text x="396" y="372" font-size="11" fill="#e05050">Нет фильтрации</text>
  <text x="396" y="387" font-size="11" fill="#e05050">по типу и важности</text>
  <text x="396" y="402" font-size="10" fill="#6b6860">всё смешано</text>

  <text x="596" y="372" font-size="11" fill="#e08830">Настройки сложные,</text>
  <text x="596" y="387" font-size="11" fill="#e08830">разные для каждой</text>
  <text x="596" y="402" font-size="10" fill="#6b6860">системы отдельно</text>

  <text x="796" y="372" font-size="11" fill="#e08830">Нет единой точки</text>
  <text x="796" y="387" font-size="11" fill="#e08830">управления группами</text>
  <text x="796" y="402" font-size="10" fill="#6b6860">подписок</text>

  <text x="996" y="372" font-size="11" fill="#c9f135">Нет данных о</text>
  <text x="996" y="387" font-size="11" fill="#c9f135">доставке и охвате</text>
  <text x="996" y="402" font-size="10" fill="#6b6860">нотификаций</text>

  <!-- ── ROW 5: ВОЗМОЖНОСТИ ── -->
  <rect x="0" y="424" width="1200" height="76" fill="#141410"/>
  <line x1="0" y1="424" x2="1200" y2="424" stroke="#2a2a24" stroke-width="1"/>
  <text x="16" y="448" font-size="9" fill="#6b6860" letter-spacing="1">ВОЗМОЖНОСТИ</text>

  <text x="196" y="448" font-size="11" fill="#50c878">Пресеты профилей</text>
  <text x="196" y="463" font-size="11" fill="#50c878">по сегментам</text>
  <text x="196" y="478" font-size="10" fill="#6b6860">онколл / CTO / минималист</text>

  <text x="396" y="448" font-size="11" fill="#50c878">Умная лента</text>
  <text x="396" y="463" font-size="11" fill="#50c878">с приоритетами</text>
  <text x="396" y="478" font-size="10" fill="#6b6860">критичное выше</text>

  <text x="596" y="448" font-size="11" fill="#50c878">Единый редактор</text>
  <text x="596" y="463" font-size="11" fill="#50c878">всех каналов</text>
  <text x="596" y="478" font-size="10" fill="#6b6860">email + push + SMS</text>

  <text x="796" y="448" font-size="11" fill="#50c878">Согласование</text>
  <text x="796" y="463" font-size="11" fill="#50c878">подписок в 1 клик</text>
  <text x="796" y="478" font-size="10" fill="#6b6860">workflow апрувов</text>

  <text x="996" y="448" font-size="11" fill="#50c878">Дашборд с метриками</text>
  <text x="996" y="463" font-size="11" fill="#50c878">охвата и доставки</text>
  <text x="996" y="478" font-size="10" fill="#6b6860">для PM и СТО</text>

  <!-- Bottom border -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#2a2a24" stroke-width="1"/>

  <!-- Footer metrics -->
  <rect x="0" y="500" width="1200" height="120" fill="#0e0e0a"/>
  <text x="40" y="530" font-size="9" fill="#6b6860" letter-spacing="2">РЕЗУЛЬТАТ</text>

  <!-- Metric 1 -->
  <text x="40" y="565" font-size="28" font-weight="bold" fill="#c9f135">584→2040</text>
  <text x="40" y="583" font-size="10" fill="#6b6860" letter-spacing="1">ПОЛУЧАТЕЛЕЙ</text>

  <!-- Metric 2 -->
  <text x="280" y="565" font-size="28" font-weight="bold" fill="#c9f135">×2.8</text>
  <text x="280" y="583" font-size="10" fill="#6b6860" letter-spacing="1">УВЕДОМЛЕНИЙ ОТПРАВЛЕНО</text>

  <!-- Metric 3 -->
  <text x="520" y="565" font-size="28" font-weight="bold" fill="#c9f135">63%→34%</text>
  <text x="520" y="583" font-size="10" fill="#6b6860" letter-spacing="1">ОБРАЩЕНИЙ В ПОДДЕРЖКУ</text>

  <!-- Metric 4 -->
  <text x="820" y="565" font-size="28" font-weight="bold" fill="#c9f135">281→373</text>
  <text x="820" y="583" font-size="10" fill="#6b6860" letter-spacing="1">УНИКАЛЬНЫХ СЦЕНАРИЕВ</text>

  <!-- Segment badges -->
  <text x="40" y="610" font-size="9" fill="#3a3a30">Сегменты: </text>
  <rect x="110" y="598" width="70" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="145" y="610" font-size="9" fill="#a8a89a" text-anchor="middle">Дежурные</text>
  <rect x="188" y="598" width="70" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="223" y="610" font-size="9" fill="#a8a89a" text-anchor="middle">CTO / Архит.</text>
  <rect x="266" y="598" width="74" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="303" y="610" font-size="9" fill="#a8a89a" text-anchor="middle">Сотрудники</text>
  <rect x="348" y="598" width="80" height="16" rx="2" fill="#1a1a16" stroke="#3a3a30" stroke-width="1"/>
  <text x="388" y="610" font-size="9" fill="#a8a89a" text-anchor="middle">Минималисты</text>
</svg>
